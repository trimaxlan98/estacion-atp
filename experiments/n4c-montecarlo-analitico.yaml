id: n4c-montecarlo-analitico
title: Monte Carlo analítico del apuntamiento
level: N4
kind: campaign
description: >
  Qué se mide: la distribución del error RMS de apuntamiento de N pases LEO
  con elevación máxima aleatoria, combinando por cuadratura cuatro términos
  físicos independientes: viento (par/kp), latencia (velocidad de acimut ×
  retardo), ruido del encoder y sesgo uniforme del encoder. No simula el
  lazo: es una fórmula, por eso 2000 pases tardan milisegundos.
  Qué se espera: con la semilla por defecto y N = 2000 el p95 queda cerca de
  0.095°, es decir, dentro del objetivo de 0.1° pero con muy poco margen, y
  la cola (p99, peor caso) la fabrica la latencia en los pases casi
  cenitales. La incertidumbre del propio percentil depende del tamaño de la
  muestra (se reporta en puntos percentiles): con N pequeño, "cumple" o "no
  cumple" puede ser puro azar.
  Por qué importa: el criterio de aceptación es el p95 y no la mediana, porque
  la mediana describe el pase típico e ignora a uno de cada veinte. Este
  modo sirve para explorar rápido qué término domina y cuánto margen queda
  antes de gastar tiempo en la simulación del lazo.
  Limitación: al ser analítico, no captura efectos no lineales del lazo
  (saturación, anti-windup); para eso está el modo del lazo.
launch: campaign_run.launch.py
args:
  mode: analitico
  n: 2000
  seed: 2029
  sigma_wind_nm: 0.010
  sigma_noise_deg: 0.02
  bias_max_deg: 0.03
  latency_max_s: 0.045
  kp: 25
  mask_deg: 5
  vel_max_deg_s: 6
params_schema:
  n: {type: integer, min: 10, max: 100000, label: "Número de pases (N)"}
  seed: {type: integer, min: 1, max: 1000000, label: "Semilla"}
  sigma_wind_nm: {type: number, min: 0.001, max: 0.1, label: "Sigma del par de viento (N·m)"}
  sigma_noise_deg: {type: number, min: 0.001, max: 0.1, label: "Sigma del ruido del encoder (°)"}
  bias_max_deg: {type: number, min: 0.001, max: 0.1, label: "Sesgo máximo del encoder (°)"}
  latency_max_s: {type: number, min: 0.001, max: 0.2, label: "Latencia máxima (s)"}
  kp: {type: number, min: 5, max: 100, label: "Ganancia proporcional kp"}
  mask_deg: {type: number, min: 1, max: 20, label: "Máscara de elevación (°)"}
  vel_max_deg_s: {type: number, min: 1, max: 30, label: "Tope de velocidad del rotor (°/s)"}
