id: n4c-montecarlo-lazo
title: Monte Carlo con el lazo simulado
level: N4
kind: campaign
description: >
  Qué se mide: la misma distribución del error RMS de apuntamiento que el
  modo analítico, pero simulando de verdad el lazo de cada pase: PID digital
  con derivada filtrada y anti-windup, montura J/b con tope de par y de
  velocidad, ambos ejes, ráfaga de viento a mitad del pase, ruido y sesgo de
  encoder y latencia como referencia retrasada. Los N pases se integran a la
  vez (vectorizado), así que el coste depende del pase más largo y no de N.
  Qué se espera: la mediana y el p95 quedan por debajo de 0.1° (del orden de
  0.03° y 0.04° con N = 300 en la validación del sprint 1), pero el p99 y el
  peor caso son de grados: los pases casi cenitales superan el tope de
  velocidad del rotor (6 °/s) y pierden al satélite en el keyhole. Eso
  se ve como una cola larga en el histograma, no como un fallo del
  simulador.
  Por qué importa: un criterio basado en la mediana diría "todo bien"; el
  p95 también, mientras que el p99 muestra que existe una fracción pequeña
  de pases donde el sistema falla de forma sistemática. Decidir si esa
  fracción es aceptable (o si se descartan esos pases) es una decisión de
  misión, no de control.
  Limitación: con N = 300 el p95 tiene una incertidumbre de unos ±1.3 puntos
  percentiles; para afirmar algo fino hace falta N mayor. La corrida con N
  alto tarda decenas de segundos.
launch: campaign_run.launch.py
args:
  mode: lazo
  n: 300
  seed: 2029
  sigma_wind_nm: 0.010
  sigma_noise_deg: 0.02
  bias_max_deg: 0.03
  latency_max_s: 0.045
  kp: 25
  mask_deg: 5
  vel_max_deg_s: 6
params_schema:
  n: {type: integer, min: 10, max: 2000, label: "Número de pases (N)"}
  seed: {type: integer, min: 1, max: 1000000, label: "Semilla"}
  sigma_wind_nm: {type: number, min: 0.001, max: 0.1, label: "Sigma del par de viento (N·m)"}
  sigma_noise_deg: {type: number, min: 0.001, max: 0.1, label: "Sigma del ruido del encoder (°)"}
  bias_max_deg: {type: number, min: 0.001, max: 0.1, label: "Sesgo máximo del encoder (°)"}
  latency_max_s: {type: number, min: 0.001, max: 0.2, label: "Latencia máxima (s)"}
  kp: {type: number, min: 5, max: 100, label: "Ganancia proporcional kp"}
  mask_deg: {type: number, min: 1, max: 20, label: "Máscara de elevación (°)"}
  vel_max_deg_s: {type: number, min: 1, max: 30, label: "Tope de velocidad del rotor (°/s)"}
