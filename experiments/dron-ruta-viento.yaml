id: dron-ruta-viento
title: Cuadrirrotor siguiendo una ruta con viento y ráfagas
level: D1
kind: proceso
description: >
  Qué se mide: un cuadrirrotor de 1.5 kg (4 hélices de 5", empuje/peso 2.2) despega y recorre tres metas a 10 m de
  altura con viento medio de 2 m/s y ráfagas Ornstein-Uhlenbeck de 1 m/s rms. Se miden tiempo, distancia, error
  transversal rms, inclinación máxima y energía.
  Qué se espera: el control en cascada rechaza el viento con el término integral y llega a todas las metas sin choque.
  Limitación: masa, inercias, arrastre y rendimiento del rotor son supuestos de orden de magnitud; no es un dron concreto.
area: plataforma
comando: [python3, scripts/dron.py, --id, "{run_id}", --salida, "{runs_dir}"]
estilo_args: cli
hecho_cuando: metrics.json
metricas: metrics.json
artefactos:
  - {ruta: telemetry.jsonl, contrato: dron_telemetria}
  - {ruta: metrics.json, contrato: dron_metricas}
recursos: ligero
timeout_s: 600
args:
  cuerpo: tierra
  semilla: 5
  ruta: [[30, 0, 10], [30, 30, 10], [0, 0, 10]]
  duracion_s: 90
  viento: [2.0, 0.0, 0.0]
  rafaga_sigma: 1.0
  v_max: 5.0
params_schema:
  duracion_s: {type: number, min: 10, max: 300, label: "Duración (s de tiempo simulado)"}
  semilla: {type: number, min: 0, max: 100000, label: "Semilla (ráfagas)"}
  rafaga_sigma: {type: number, min: 0, max: 5, label: "Ráfagas, σ (m/s)"}
  v_max: {type: number, min: 1, max: 12, label: "Velocidad máxima (m/s)"}
