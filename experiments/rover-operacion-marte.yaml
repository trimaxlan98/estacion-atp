id: rover-operacion-marte
title: Operación del rover en Marte con retardo y ventanas del relé
level: R8
kind: proceso
description: >
  Qué se mide: durante unos soles, cuánto avanza un rover en Marte (Gale, relé MRO, retardo de luz de la fecha elegida, ventanas
  del relé de R7) según cómo lo opere la Tierra: (a) teleoperación mover y esperar, (b) metas por pase, (c) plan de sol con
  alarmas locales o (d) operador con gemelo digital. Se reporta la distancia útil por sol, el tiempo ocioso esperando órdenes,
  comandos perdidos o caducados, atascos, vuelcos, energía y el tiempo que tarda en reaccionar a un peligro (local o vía Tierra).
  Qué se espera: con ventanas de horas la teleoperación casi no avanza y la autonomía con alarmas locales recorre del orden de
  kilómetros por sol. Limitación: el rover es un sustituto cinemático calibrado con la dinámica de R1, los peligros son una regla
  y el enlace usa los supuestos de R7; nada está validado contra un rover real.
area: rf
comando: [python3, scripts/operacion_rover.py, --id, "{run_id}", --salida, "{runs_dir}"]
estilo_args: cli
hecho_cuando: metrics.json
metricas: metrics.json
recursos: ligero
timeout_s: 600
args:
  planeta: marte
  terreno: rocoso
  modo: plan_sol
  semilla: 0
  n_soles: 3
  conduccion_h: 2.0
  fecha: "2026-10-07"
  bache_por_km: 2.0
  p_perdida_cmd: 0.02
  p_perdida_estado: 0.02
  reaccion_operador_s: 10.0
params_schema:
  terreno: {type: enum, options: [llano, rocoso, dunas, rocas, pendiente], label: "Terreno (campo de pendientes de R1)"}
  modo: {type: enum, options: [teleop, metas, plan_sol, gemelo], label: "Modo de operación (a, b, c, d)"}
  semilla: {type: integer, min: 0, max: 99, label: "Semilla (terreno, peligros, pérdidas)"}
  n_soles: {type: integer, min: 1, max: 5, label: "Soles simulados"}
  conduccion_h: {type: number, min: 0.5, max: 8, label: "Horas de conducción por sol"}
  bache_por_km: {type: number, min: 0, max: 20, label: "Zonas blandas ocultas por km"}
  p_perdida_cmd: {type: number, min: 0, max: 0.9, label: "Probabilidad de perder un comando"}
  p_perdida_estado: {type: number, min: 0, max: 0.9, label: "Probabilidad de perder una telemetría"}
  reaccion_operador_s: {type: number, min: 0, max: 600, label: "Tiempo de decisión del operador (s)"}
