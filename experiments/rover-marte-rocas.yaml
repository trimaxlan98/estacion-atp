id: rover-marte-rocas
title: Rover rocker-bogie en Marte entre rocas discretas
level: R6
kind: proceso
description: >
  Qué se mide: el rover con suspensión rocker-bogie real (balancín, bogie y barra diferencial) recorre en simulación
  una ruta de dos metas por un campo de rocas discretas con la distribución de tamaños de Golombek y Rapp (1997) para
  Marte (abundancia total 0.12), con la navegación completa (A* con costo graduado, replanificación). Se miden distancia,
  energía, deslizamiento y el margen mínimo de estabilidad al vuelco.
  Qué se espera: llega a las metas rodeando las rocas más altas; el balancín y el bogie se mueven al pasar sobre las bajas.
  Limitación: forma de las rocas (semi-elipsoides) y suelo de Marte supuestos; ver docs/ROVER.md «Resultados R6».
area: plataforma
comando: [python3, scripts/rover.py, --id, "{run_id}", --salida, "{runs_dir}"]
estilo_args: cli
hecho_cuando: metrics.json
metricas: metrics.json
artefactos:
  - {ruta: telemetry.jsonl, contrato: rover_telemetria}
  - {ruta: metrics.json, contrato: rover_metricas}
recursos: ligero
timeout_s: 900
args:
  planeta: marte
  terreno: rocas
  semilla: 5
  terreno_params: {abundancia: 0.12, radio_rocas: 25, extension: 60}
  suspension: rocker_bogie
  navegacion: completa
  ruta: [[15, 0], [15, 10]]
  duracion_s: 150
  v_max: 0.5
params_schema:
  duracion_s: {type: number, min: 10, max: 300, label: "Duración (s de tiempo simulado)"}
  v_max: {type: number, min: 0.1, max: 1.0, label: "Velocidad de crucero (m/s)"}
