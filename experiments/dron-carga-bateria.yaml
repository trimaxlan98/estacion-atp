id: dron-carga-bateria
title: Cuadrirrotor con carga útil y batería limitada
level: D2
kind: proceso
description: >
  Qué se mide: ruta de 40 m con 0.5 kg de carga útil (masa total 2 kg) y una batería de 8 Wh. Se mide si completa la ruta,
  el estado de carga final y la energía.
  Qué se espera: llega a las metas y vuelve con carga restante positiva o la batería se agota y la corrida termina (métrica
  bateria_agotada). Limitación: batería ideal sin caída de tensión ni degradación; inercia sin recalcular con la carga.
area: plataforma
comando: [python3, scripts/dron.py, --id, "{run_id}", --salida, "{runs_dir}"]
estilo_args: cli
hecho_cuando: metrics.json
metricas: metrics.json
artefactos:
  - {ruta: telemetry.jsonl, contrato: dron_telemetria}
  - {ruta: metrics.json, contrato: dron_metricas}
recursos: ligero
timeout_s: 600
args:
  cuerpo: tierra
  semilla: 3
  ruta: [[40, 0, 10], [0, 0, 10]]
  duracion_s: 120
  dron: {masa_kg: 2.0, bateria_wh: 8.0}
  v_max: 5.0
params_schema:
  duracion_s: {type: number, min: 10, max: 300, label: "Duración (s de tiempo simulado)"}
  semilla: {type: number, min: 0, max: 100000, label: "Semilla (ráfagas)"}
  v_max: {type: number, min: 1, max: 12, label: "Velocidad máxima (m/s)"}
